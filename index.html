<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Paramedic AR-CPR Simulator</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            background: #000;
            color: #ffffff;
        }

        /* Minimized HUD - แบบกะทัดรัด */
        .hud-container {
            position: fixed;
            top: 5px;
            left: 5px;
            right: 5px;
            z-index: 1000;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 10px;
            padding: 8px 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            transition: all 0.3s ease;
            max-height: 45px;
            overflow: hidden;
        }

        .hud-container.expanded {
            max-height: 200px;
        }

        .hud-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        .hud-title {
            color: #38bdf8;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .hud-title i {
            color: #ef4444;
        }

        .expand-btn {
            background: transparent;
            border: none;
            color: #94a3b8;
            font-size: 16px;
            cursor: pointer;
            padding: 4px;
        }

        /* Content ที่จะแสดงเมื่อขยาย */
        .hud-content {
            margin-top: 10px;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .expanded .hud-content {
            opacity: 1;
            pointer-events: all;
        }

        /* Scenario Selector แบบกะทัดรัด */
        .scenario-selector {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
        }

        .scenario-btn {
            flex: 1;
            padding: 8px 6px;
            background: rgba(30, 41, 59, 0.9);
            border: 1px solid transparent;
            border-radius: 8px;
            color: #e2e8f0;
            font-size: 11px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .scenario-btn.active {
            background: rgba(56, 189, 248, 0.2);
            border-color: #38bdf8;
        }

        .scenario-btn .icon {
            font-size: 14px;
            margin-bottom: 2px;
        }

        /* Control Panel แบบกะทัดรัด */
        .control-panel {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }

        .control-btn {
            flex: 1;
            padding: 8px;
            background: rgba(30, 41, 59, 0.9);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            transition: all 0.3s ease;
        }

        /* Mini Gauge - แสดงเฉพาะตัวเลข */
        .mini-gauge {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.7);
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 12px;
        }

        .gauge-value {
            font-weight: 700;
            font-size: 14px;
            color: #38bdf8;
        }

        .gauge-status {
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 600;
        }

        .status-good {
            background: rgba(34, 197, 94, 0.2);
            color: #4ade80;
        }

        .status-slow {
            background: rgba(245, 158, 11, 0.2);
            color: #fbbf24;
        }

        .status-fast {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
        }

        /* Instructions แบบลอยตัว - สามารถลากเคลื่อนที่ได้ */
        .instructions {
            position: fixed;
            bottom: 10px;
            right: 10px;
            width: 200px;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(8px);
            border-radius: 10px;
            padding: 10px;
            border: 1px solid rgba(56, 189, 248, 0.3);
            z-index: 999;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            cursor: move;
            resize: both;
            overflow: auto;
            max-height: 150px;
            font-size: 11px;
            line-height: 1.3;
        }

        .instructions.collapsed {
            height: 30px;
            overflow: hidden;
        }

        .instructions-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            cursor: pointer;
        }

        .instructions-title {
            color: #38bdf8;
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .collapse-btn {
            background: transparent;
            border: none;
            color: #94a3b8;
            font-size: 12px;
            cursor: pointer;
            padding: 2px;
        }

        .instruction-step {
            display: flex;
            margin-bottom: 5px;
        }

        .step-number {
            background: #38bdf8;
            color: #0f172a;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 700;
            margin-right: 6px;
            flex-shrink: 0;
        }

        /* Auto-hide notification */
        .auto-hide-notice {
            position: fixed;
            bottom: 50%;
            left: 50%;
            transform: translate(-50%, 50%);
            background: rgba(15, 23, 42, 0.95);
            border: 2px solid #38bdf8;
            border-radius: 12px;
            padding: 15px;
            z-index: 2000;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            animation: fadeInOut 3s ease-in-out forwards;
        }

        @keyframes fadeInOut {
            0% { opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { opacity: 0; }
        }

        /* AR View Mode - ซ่อน UI ทั้งหมด */
        .ar-view-mode .hud-container,
        .ar-view-mode .instructions {
            opacity: 0.2;
            transition: opacity 0.3s ease;
        }

        .ar-view-mode .hud-container:hover,
        .ar-view-mode .instructions:hover {
            opacity: 1;
        }

        /* Fullscreen Toggle */
        .fullscreen-btn {
            position: fixed;
            bottom: 10px;
            left: 10px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid #38bdf8;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            color: #38bdf8;
            font-size: 18px;
            cursor: pointer;
            z-index: 1001;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .fullscreen-btn:hover {
            background: rgba(56, 189, 248, 0.2);
        }

        /* Responsive สำหรับมือถือแนวตั้ง */
        @media (orientation: portrait) and (max-height: 700px) {
            .hud-container {
                top: 2px;
                left: 2px;
                right: 2px;
                padding: 5px 8px;
                max-height: 35px;
            }
            
            .instructions {
                width: 180px;
                font-size: 10px;
                max-height: 120px;
            }
            
            .fullscreen-btn {
                width: 35px;
                height: 35px;
                font-size: 16px;
            }
        }

        /* สำหรับมือถือแนวนอน */
        @media (orientation: landscape) {
            .hud-container {
                top: 5px;
                left: 5px;
                right: auto;
                width: 180px;
            }
            
            .instructions {
                left: 10px;
                right: auto;
                bottom: 10px;
            }
            
            .fullscreen-btn {
                right: 10px;
                left: auto;
            }
        }
    </style>
</head>
<body>
    <!-- Fullscreen Toggle -->
    <button class="fullscreen-btn" id="fullscreen-btn" title="ซ่อน/แสดง UI">
        <i class="fas fa-eye"></i>
    </button>

    <!-- AR Scene (เหมือนเดิม) -->
    <a-scene 
        embedded 
        arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
        vr-mode-ui="enabled: false"
        renderer="logarithmicDepthBuffer: true; precision: medium;"
    >
        <a-marker id="hiro-marker" preset="hiro" smooth="true" smoothCount="10" smoothTolerance="0.01">
            
            <!-- Torso Model -->
            <a-box 
                id="torso" 
                position="0 0.15 0" 
                width="1.4" 
                height="0.25" 
                depth="1.6" 
                color="#475569" 
                opacity="0.9"
                roughness="0.7"
            >
                <a-plane 
                    position="0 0.13 0.2" 
                    width="0.4" 
                    height="0.1" 
                    color="#dc2626" 
                    opacity="0.6"
                    side="double"
                ></a-plane>
            </a-box>

            <!-- Head with Airway -->
            <a-entity id="head" position="0 0.35 -1">
                <a-sphere radius="0.3" color="#cbd5e1" roughness="0.8"></a-sphere>
                <a-entity position="0 0.05 0.3" rotation="-30 0 0">
                    <a-cone 
                        radius-bottom="0.05" 
                        radius-top="0.02" 
                        height="0.15" 
                        color="#38bdf8" 
                        opacity="0.7"
                        side="double"
                    ></a-cone>
                </a-entity>
            </a-entity>

            <!-- Compression Target -->
            <a-cylinder 
                id="compression-target"
                position="0 0.22 0.2" 
                radius="0.2" 
                height="0.04" 
                color="#ef4444" 
                opacity="0.8"
                side="double"
            >
                <a-animation 
                    id="compression-animation"
                    attribute="position" 
                    from="0 0.22 0.2" 
                    to="0 0.17 0.2" 
                    dur="0.5" 
                    repeat="indefinite" 
                    direction="alternate"
                    easing="easeInOutSine"
                ></a-animation>
            </a-cylinder>

            <!-- Compression Hands -->
            <a-entity id="compression-hands" position="0 0.5 0.2">
                <a-box position="-0.08 0 0" width="0.15" height="0.05" depth="0.05" color="#fbbf24"></a-box>
                <a-box position="0.08 0 0" width="0.15" height="0.05" depth="0.05" color="#fbbf24"></a-box>
                <a-cone position="0 -0.15 0" rotation="180 0 0" radius-bottom="0.1" radius-top="0.02" height="0.25" color="#eab308" opacity="0.7"></a-cone>
                <a-animation 
                    attribute="position" 
                    from="0 0.5 0.2" 
                    to="0 0.35 0.2" 
                    dur="0.5" 
                    repeat="indefinite" 
                    direction="alternate"
                    easing="easeInOutSine"
                ></a-animation>
            </a-entity>

            <!-- AED Pads -->
            <a-entity id="aed-pads" visible="false">
                <a-plane id="aed-pad-right" position="0.4 0.22 0.5" rotation="-90 0 0" width="0.25" height="0.25" color="#10b981" opacity="0.7">
                    <a-text value="AED\n(R)" align="center" position="0 0 0.01" scale="0.3 0.3 0.3" color="#ffffff"></a-text>
                </a-plane>
                <a-plane id="aed-pad-left" position="-0.4 0.22 0.2" rotation="-90 0 0" width="0.25" height="0.25" color="#10b981" opacity="0.7">
                    <a-text value="AED\n(L)" align="center" position="0 0 0.01" scale="0.3 0.3 0.3" color="#ffffff"></a-text>
                </a-plane>
            </a-entity>

        </a-marker>

        <a-entity camera="fov: 80; near: 0.01; far: 1000" position="0 0 0"></a-entity>
        <a-entity light="type: ambient; color: #888; intensity: 0.8"></a-entity>
        <a-entity light="type: directional; color: #ffffff; intensity: 0.8" position="2 5 3"></a-entity>
    </a-scene>

    <!-- Minimal HUD -->
    <div class="hud-container" id="hud">
        <div class="hud-header" id="hud-toggle">
            <div class="hud-title">
                <i class="fas fa-heartbeat"></i>
                CPR AR Simulator
            </div>
            <button class="expand-btn">
                <i class="fas fa-chevron-down" id="expand-icon"></i>
            </button>
        </div>
        
        <div class="hud-content">
            <!-- Scenario Selector -->
            <div class="scenario-selector">
                <button class="scenario-btn adult active" data-scenario="adult">
                    <div class="icon"><i class="fas fa-male"></i></div>
                    ผู้ใหญ่
                </button>
                <button class="scenario-btn pediatric" data-scenario="pediatric">
                    <div class="icon"><i class="fas fa-child"></i></div>
                    เด็ก
                </button>
                <button class="scenario-btn aed" data-scenario="aed">
                    <div class="icon"><i class="fas fa-bolt"></i></div>
                    AED
                </button>
            </div>

            <!-- Control Panel -->
            <div class="control-panel">
                <button class="control-btn" id="metronome-btn">
                    <i class="fas fa-music"></i>
                    Metronome
                </button>
                <button class="control-btn" id="haptic-btn">
                    <i class="fas fa-vibrate"></i>
                    Haptic
                </button>
            </div>

            <!-- Mini Gauge -->
            <div class="mini-gauge">
                <div>อัตรากด:</div>
                <div class="gauge-value" id="compression-rate">110/min</div>
                <div class="gauge-status status-good" id="compression-status">ดี</div>
            </div>
        </div>
    </div>

    <!-- Collapsible Instructions -->
    <div class="instructions" id="instructions">
        <div class="instructions-header" id="instructions-toggle">
            <div class="instructions-title">
                <i class="fas fa-graduation-cap"></i>
                ขั้นตอน
            </div>
            <button class="collapse-btn">
                <i class="fas fa-minus" id="collapse-icon"></i>
            </button>
        </div>
        <div class="instructions-content">
            <div class="instruction-step">
                <div class="step-number">1</div>
                <div>ตรวจสอบสถานที่ปลอดภัย</div>
            </div>
            <div class="instruction-step">
                <div class="step-number">2</div>
                <div>ประเมินการตอบสนอง</div>
            </div>
            <div class="instruction-step">
                <div class="step-number">3</div>
                <div>เรียก 1669 + AED</div>
            </div>
            <div class="instruction-step">
                <div class="step-number">4</div>
                <div>กดหน้าอกจุดสีแดง</div>
            </div>
        </div>
    </div>

    <script>
        // Global Variables
        let currentScenario = 'adult';
        let metronomeActive = false;
        let hapticActive = false;
        let metronomeInterval;
        let compressionRate = 110;
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        let metronomeBuffer = null;
        let isHudExpanded = false;
        let isInstructionsCollapsed = false;
        let isArViewMode = false;

        // UI Minimization Functions
        function toggleHud() {
            const hud = document.getElementById('hud');
            const expandIcon = document.getElementById('expand-icon');
            
            isHudExpanded = !isHudExpanded;
            hud.classList.toggle('expanded', isHudExpanded);
            expandIcon.className = isHudExpanded ? 'fas fa-chevron-up' : 'fas fa-chevron-down';
        }

        function toggleInstructions() {
            const instructions = document.getElementById('instructions');
            const collapseIcon = document.getElementById('collapse-icon');
            
            isInstructionsCollapsed = !isInstructionsCollapsed;
            instructions.classList.toggle('collapsed', isInstructionsCollapsed);
            collapseIcon.className = isInstructionsCollapsed ? 'fas fa-plus' : 'fas fa-minus';
        }

        function toggleArViewMode() {
            isArViewMode = !isArViewMode;
            document.body.classList.toggle('ar-view-mode', isArViewMode);
            
            // Show notification
            showNotification(isArViewMode ? 'โหมดกล้อง: แตะ UI เพื่อแสดง' : 'โหมดปกติ');
            
            // Auto-hide UI in AR mode
            if (isArViewMode) {
                setTimeout(() => {
                    document.getElementById('hud').style.opacity = '0.1';
                    document.getElementById('instructions').style.opacity = '0.1';
                }, 2000);
            } else {
                document.getElementById('hud').style.opacity = '1';
                document.getElementById('instructions').style.opacity = '1';
            }
        }

        function showNotification(message) {
            const notice = document.createElement('div');
            notice.className = 'auto-hide-notice';
            notice.innerHTML = `
                <div style="margin-bottom: 8px; font-size: 24px;"><i class="fas fa-info-circle"></i></div>
                <div style="font-size: 14px; font-weight: 600;">${message}</div>
            `;
            document.body.appendChild(notice);
            
            setTimeout(() => {
                if (notice.parentNode) {
                    notice.parentNode.removeChild(notice);
                }
            }, 3000);
        }

        // Make instructions draggable
        function makeDraggable(element) {
            let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
            
            element.onmousedown = dragMouseDown;
            element.ontouchstart = touchStart;
            
            function dragMouseDown(e) {
                e = e || window.event;
                e.preventDefault();
                pos3 = e.clientX;
                pos4 = e.clientY;
                document.onmouseup = closeDragElement;
                document.onmousemove = elementDrag;
            }
            
            function touchStart(e) {
                e.preventDefault();
                const touch = e.touches[0];
                pos3 = touch.clientX;
                pos4 = touch.clientY;
                document.ontouchend = closeDragElement;
                document.ontouchmove = elementTouchMove;
            }
            
            function elementDrag(e) {
                e = e || window.event;
                e.preventDefault();
                pos1 = pos3 - e.clientX;
                pos2 = pos4 - e.clientY;
                pos3 = e.clientX;
                pos4 = e.clientY;
                element.style.top = (element.offsetTop - pos2) + "px";
                element.style.left = (element.offsetLeft - pos1) + "px";
            }
            
            function elementTouchMove(e) {
                const touch = e.touches[0];
                pos1 = pos3 - touch.clientX;
                pos2 = pos4 - touch.clientY;
                pos3 = touch.clientX;
                pos4 = touch.clientY;
                element.style.top = (element.offsetTop - pos2) + "px";
                element.style.left = (element.offsetLeft - pos1) + "px";
            }
            
            function closeDragElement() {
                document.onmouseup = null;
                document.onmousemove = null;
                document.ontouchend = null;
                document.ontouchmove = null;
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            // Set up UI interactions
            document.getElementById('hud-toggle').addEventListener('click', toggleHud);
            document.getElementById('instructions-toggle').addEventListener('click', toggleInstructions);
            document.getElementById('fullscreen-btn').addEventListener('click', toggleArViewMode);
            
            // Make instructions draggable
            makeDraggable(document.getElementById('instructions'));
            
            // Initialize with minimal UI
            setTimeout(() => {
                showNotification('แตะ UI เพื่อขยาย/ย่อ • ลากข้อความเคลื่อนที่ได้');
            }, 1000);
            
            // Scenario buttons
            document.querySelectorAll('.scenario-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    changeScenario(this.dataset.scenario);
                });
            });
            
            // Control buttons
            document.getElementById('metronome-btn').addEventListener('click', toggleMetronome);
            document.getElementById('haptic-btn').addEventListener('click', toggleHaptic);
            
            // Auto-collapse instructions on small screens
            if (window.innerHeight < 700) {
                toggleInstructions();
            }
        });

        // Rest of the functions (toggleMetronome, toggleHaptic, changeScenario, etc.)
        // ใช้ฟังก์ชันจากโค้ดก่อนหน้า (บรรทัด 320-450) แต่ลดโค้ดแสดงเพื่อความกระชับ
        
        function toggleMetronome() {
            metronomeActive = !metronomeActive;
            const btn = document.getElementById('metronome-btn');
            btn.classList.toggle('active', metronomeActive);
            btn.innerHTML = metronomeActive ? 
                '<i class="fas fa-stop"></i> หยุดเมโทรโนม' : 
                '<i class="fas fa-music"></i> เมโทรโนม';
            
            if (metronomeActive) {
                const interval = 60000 / compressionRate;
                metronomeInterval = setInterval(() => {
                    if (navigator.vibrate && hapticActive) {
                        navigator.vibrate(50);
                    }
                }, interval);
            } else {
                clearInterval(metronomeInterval);
            }
        }
        
        function toggleHaptic() {
            hapticActive = !hapticActive;
            const btn = document.getElementById('haptic-btn');
            btn.classList.toggle('active', hapticActive);
            
            if (hapticActive && navigator.vibrate) {
                navigator.vibrate([100, 50, 100]);
            }
        }
        
        function changeScenario(scenario) {
            currentScenario = scenario;
            document.querySelectorAll('.scenario-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            document.querySelector(`.scenario-btn.${scenario}`).classList.add('active');
        }

        // Auto-hide UI when marker is detected
        const scene = document.querySelector('a-scene');
        if (scene) {
            scene.addEventListener('markerFound', function() {
                if (!isHudExpanded) {
                    document.getElementById('hud').style.opacity = '0.3';
                }
            });
            
            scene.addEventListener('markerLost', function() {
                document.getElementById('hud').style.opacity = '1';
            });
        }
    </script>
</body>
</html>
